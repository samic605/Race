void drawTurnArrow(){
    if(car.speed < 3.0f) return;
    int seg = findNearestSegment(car.x, car.z, NULL);
    int lookSeg = (seg + 20) % TRACK_SEGMENTS;
    int lookSeg2 = (seg + 40) % TRACK_SEGMENTS;
    float dx1 = trackPoints[lookSeg].x - trackPoints[seg].x;
    float dz1 = trackPoints[lookSeg].z - trackPoints[seg].z;
    float dx2 = trackPoints[lookSeg2].x - trackPoints[lookSeg].x;
    float dz2 = trackPoints[lookSeg2].z - trackPoints[lookSeg].z;
    float cross = dx1 * dz2 - dz1 * dx2;
    if(fabsf(cross) < 2.0f) return;
    unsigned int col = cross > 0 ? 0xFFFFAA00 : 0xFFFF5500;
    float cx = 240, cy = 50;
    if(cross > 0) {
        drawRect(cx+30, cy-4, 20, 8, col);
        drawRect(cx+40, cy-12, 8, 8, col);
        drawRect(cx+40, cy+4, 8, 8, col);
    } else {
        drawRect(cx-50, cy-4, 20, 8, col);
        drawRect(cx-48, cy-12, 8, 8, col);
        drawRect(cx-48, cy+4, 8, 8, col);
    }
}

