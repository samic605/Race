#define AUDIO_SAMPLE_RATE 22050
#define AUDIO_BUFSIZE 512
#define AUDIO_CHANNELS 8

typedef struct {
    short *buffer;
    int active;
    int length;
    int pos;
    float volume;
} AudioVoice;

static AudioVoice voices[AUDIO_CHANNELS];
static int audioReady = 0;
static float globalSfxVolume = 0.8f;

typedef void (*SynthFunc)(short *buf, int len, float param);

static void synthImpact(short *buf, int len, float strength){
    for(int i=0;i<len;i++){
        float env = 1.0f - (float)i/len;
        float noise = ((randInt()%2000)-1000)/1000.0f;
        float low = sinf((float)i * 0.05f) * 0.5f;
        float s = (noise*0.7f + low*0.3f) * env * env * strength;
        buf[i] = (short)(s * 32767.0f);
    }
}
static void synthNitro(short *buf, int len, float amp){
    for(int i=0;i<len;i++){
        float t = (float)i/len;
        float freq = 200.0f + t*600.0f;
        float noise = ((randInt()%2000)-1000)/1000.0f * 0.3f;
        float s = sinf((float)i * 6.2831f * freq / AUDIO_SAMPLE_RATE) * 0.5f + noise;
        buf[i] = (short)(s * 32767.0f * amp * (1.0f-t*0.3f));
    }
}
static void synthDrift(short *buf, int len, float amp){
    for(int i=0;i<len;i++){
        float t = (float)i/len;
        float freq = 600.0f + sinf((float)i*0.08f)*200.0f;
        float s = sinf((float)i * 6.2831f * freq / AUDIO_SAMPLE_RATE);
        buf[i] = (short)(s * 32767.0f * amp * (0.5f + 0.5f*t));
    }
}
static void synthHorn(short *buf, int len, float amp){
    for(int i=0;i<len;i++){
        float t = (float)i / AUDIO_SAMPLE_RATE;
        float s = sinf(t*6.2831f*440.0f)*0.5f + sinf(t*6.2831f*550.0f)*0.5f;
        float env = 1.0f;
        if(i < 200) env = i/200.0f;
        if(i > len-400) env = (len-i)/400.0f;
        buf[i] = (short)(s * 32767.0f * amp * env);
    }
}
static void synthPass(short *buf, int len, float amp){
    for(int i=0;i<len;i++){
        float t = (float)i/len;
        float env = sinf(t*3.14159f);
        float noise = ((randInt()%2000)-1000)/1000.0f;
        buf[i] = (short)(noise * 32767.0f * amp * env * 0.6f);
    }
}

static int findFreeVoice(){
    for(int i=0;i<AUDIO_CHANNELS;i++) if(!voices[i].active) return i;
    return -1;
}
static void playSynth(SynthFunc fn, int lenMs, float param){
    if(!audioReady) return;
    int idx = findFreeVoice();
    if(idx < 0) return;
    AudioVoice *v = &voices[idx];
    int len = (AUDIO_SAMPLE_RATE * lenMs) / 1000;
    if(len > AUDIO_BUFSIZE) len = AUDIO_BUFSIZE;
    memset(v->buffer, 0, AUDIO_BUFSIZE * sizeof(short));
    fn(v->buffer, len, param);
    v->length = len;
    v->pos = 0;
    v->volume = globalSfxVolume;
    v->active = 1;
}
static short mixBuffer[AUDIO_BUFSIZE];
static void audioMix(){
    if(!audioReady) return;
    memset(mixBuffer, 0, sizeof(mixBuffer));
    for(int i=0;i<AUDIO_CHANNELS;i++){
        if(!voices[i].active) continue;
        AudioVoice *v = &voices[i];
        int remain = v->length - v->pos;
        int n = remain < AUDIO_BUFSIZE ? remain : AUDIO_BUFSIZE;
        for(int j=0;j<n;j++){
            int m = mixBuffer[j] + (int)(v->buffer[v->pos + j] * v->volume);
            if(m > 32767) m = 32767;
            if(m < -32768) m = -32768;
            mixBuffer[j] = (short)m;
        }
        v->pos += n;
        if(v->pos >= v->length) v->active = 0;
    }
    sceAudioOutputBlocking(0, PSP_AUDIO_VOLUME_MAX, mixBuffer);
}

static void sfxImpact(float strength){ playSynth((SynthFunc)(void*)synthImpact, 180, strength); }
static void sfxNitro(){ playSynth((SynthFunc)(void*)synthNitro, 400, 0.7f); }
static void sfxDriftIn(){ playSynth((SynthFunc)(void*)synthDrift, 250, 0.6f); }
static void sfxDriftOut(){ playSynth((SynthFunc)(void*)synthDrift, 200, 0.4f); }
static void sfxHorn(){ playSynth((SynthFunc)(void*)synthHorn, 350, 0.5f); }
static void sfxPass(){ playSynth((SynthFunc)(void*)synthPass, 300, 0.3f); }

static int initAudio(){
    for(int i=0;i<AUDIO_CHANNELS;i++){
        voices[i].buffer = (short*)malloc(AUDIO_BUFSIZE * sizeof(short));
        if(!voices[i].buffer) return 0;
        voices[i].active = 0;
    }
    int ch = sceAudioChReserve(0, AUDIO_BUFSIZE, PSP_AUDIO_FORMAT_MONO);
    if(ch < 0) return 0;
    audioReady = 1;
    return 1;
}

