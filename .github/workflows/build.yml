typedef struct {
    int type;
    float segIndex;
    float speed;
    float x, z, y;
    float angle;
    float damage;
    int active;
    int passed;
    float hornCooldown;
} TrafficCar;

static TrafficCar traffic[MAX_TRAFFIC];

void deformTraffic(int idx, float damageDelta) {
    TrafficCar *tc = &traffic[idx];
    if (damageDelta <= 0.0f) return;
    tc->damage += damageDelta;
    if (tc->damage > 1.0f) tc->damage = 1.0f;
    int type = tc->type;
    for (int i = 0; i < trafficVertCount[type]; i++) {
        Vertex3D *v = &trafficVertices[type][i];
        Vertex3D *orig = &trafficOriginalVertices[type][i];
        float weight = tc->damage;
        v->x = orig->x + sinf((float)i * 1.7f) * weight * 0.3f;
        v->y = orig->y - weight * 0.15f + cosf((float)i * 2.3f) * weight * 0.1f;
        v->z = orig->z + cosf((float)i * 3.1f) * weight * 0.2f;
    }
}

void initTraffic() {
    for (int i = 0; i < MAX_TRAFFIC; i++) {
        traffic[i].active = 1;
        traffic[i].type = i % 3;
        traffic[i].speed = -(8.0f + (i % 4) * 2.0f);
        traffic[i].damage = 0.0f;
        traffic[i].passed = 0;
        traffic[i].hornCooldown = 0.0f;
        traffic[i].segIndex = (float)(i * TRACK_SEGMENTS / MAX_TRAFFIC);
    }
}

void updateTraffic(float dt) {
    for (int i = 0; i < MAX_TRAFFIC; i++) {
        TrafficCar *tc = &traffic[i];
        if (!tc->active) continue;
        tc->segIndex -= fabsf(tc->speed) * dt * 4.0f;
        if (tc->segIndex < 0) tc->segIndex += TRACK_SEGMENTS;
        if (tc->segIndex >= TRACK_SEGMENTS) tc->segIndex -= TRACK_SEGMENTS;
        int seg = (int)tc->segIndex;
        if (seg < 0) seg = 0;
        if (seg >= TRACK_SEGMENTS) seg = TRACK_SEGMENTS - 1;
        TrackPoint *p = &trackPoints[seg];
        int nextSeg = (seg + 1) % TRACK_SEGMENTS;
        float dx = trackPoints[nextSeg].x - p->x;
        float dz = trackPoints[nextSeg].z - p->z;
        float len = sqrtf(dx*dx + dz*dz);
        if (len < 0.001f) len = 1;
        float nx = -dz / len;
        float nz = dx / len;
        float laneOffset = 2.5f;
        tc->x = p->x + nx * laneOffset;
        tc->z = p->z + nz * laneOffset;
        tc->y = p->y;
        tc->angle = atan2f(-dx, -dz);
        if(tc->hornCooldown > 0) tc->hornCooldown -= dt;
    }
}

void checkTrafficCollision() {
    for (int i = 0; i < MAX_TRAFFIC; i++) {
        TrafficCar *tc = &traffic[i];
        if (!tc->active) continue;
        float dx = car.x - tc->x;
        float dz = car.z - tc->z;
        float dist = sqrtf(dx*dx + dz*dz);
        if(dist < 8.0f && dist >= 2.5f && tc->hornCooldown <= 0.0f){
            sfxHorn();
            tc->hornCooldown = 2.5f + (randInt()%100)/100.0f;
        }
        if (dist < 2.5f) {
            float relSpeed = fabsf(car.speed) + fabsf(tc->speed);
            float damageDelta = relSpeed / (MAX_SPEED * 2.0f);
            if (damageDelta > 0.6f) damageDelta = 0.6f;
            float hitDirX = dx / (dist + 0.001f);
            float hitDirZ = dz / (dist + 0.001f);
            deformCar(damageDelta, hitDirX, hitDirZ);
            deformTraffic(i, damageDelta);
            carHP -= damageDelta * 50.0f;
            if (carHP < 0) carHP = 0;
            comboCount = 0;
            spawnSparks((car.x + tc->x) / 2, car.y + 0.5f, (car.z + tc->z) / 2, hitDirX, hitDirZ, 12);
            sfxImpact(damageDelta * 1.5f);
            car.speed *= 0.3f;
            car.x += hitDirX * 1.0f;
            car.z += hitDirZ * 1.0f;
            tc->speed *= 0.5f;
            tc->x -= hitDirX * 0.5f;
            tc->z -= hitDirZ * 0.5f;
        }
        if(!tc->passed && fabsf(dz) < 8.0f && fabsf(dx) < 4.0f && car.speed > tc->speed + 5.0f){
            sfxPass();
            tc->passed = 1;
            comboCount++;
            comboTime = 3.0f;
            totalScore += 50 * comboCount;
        }
        if (tc->passed && fabsf(dz) > 15.0f) tc->passed = 0;
    }
}

void drawTraffic() {
    for (int i = 0; i < MAX_TRAFFIC; i++) {
        TrafficCar *tc = &traffic[i];
        if (!tc->active) continue;
        int type = tc->type;
        if (trafficVertCount[type] == 0) continue;
        sceGumMatrixMode(GU_MODEL);
        sceGumLoadIdentity();
        ScePspFVector3 pos = {tc->x, tc->y, tc->z};
        sceGumTranslate(&pos);
        ScePspFVector3 rot = {0, tc->angle, 0};
        sceGumRotateXYZ(&rot);
        sceGumDrawArray(GU_TRIANGLES,
            GU_INDEX_16BIT | GU_VERTEX_32BITF | GU_COLOR_8888 | GU_TRANSFORM_3D,
            trafficIdxCount[type], trafficIndices[type], trafficVertices[type]);
    }
}

