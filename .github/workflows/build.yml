void drawRaceScene(){
    int weather = maps[selectedMap].weather;
    if(weather==1){ sceGuClearColor(0xFF2C3E50); }
    else { sceGuClearColor(0xFF87CEEB); }
    sceGuClear(GU_COLOR_BUFFER_BIT|GU_DEPTH_BUFFER_BIT);

    sceGuEnable(GU_DEPTH_TEST);sceGuDepthFunc(GU_GEQUAL);
    sceGuEnable(GU_CULL_FACE);sceGuFrontFace(GU_CW);
    sceGuEnable(GU_FOG);sceGuFog(50.0f,180.0f,0xFF87CEEB);
    sceGuTexMode(GU_PSM_8888,0,0,0);
    sceGuTexImage(0,256,64,256,textureAtlas);
    sceGuTexFilter(GU_NEAREST,GU_NEAREST);
    sceGuTexFunc(GU_TFX_MODULATE,GU_TCC_RGBA);
    sceGuEnable(GU_TEXTURE_2D);
    sceGumMatrixMode(GU_PROJECTION);sceGumLoadIdentity();
    sceGumPerspective(75.0f,16.0f/9.0f,0.5f,300.0f);

    // Камера — для реплея смотрим на записанную машину
    float camFocusX, camFocusZ, camFocusAngle;
    if(replayPlayback && replayCount > 0){
        ReplayFrame* f = &replayBuf[replayPlaybackIdx];
        camFocusX = f->px; camFocusZ = f->pz; camFocusAngle = f->pa;
    } else {
        camFocusX = car.x; camFocusZ = car.z; camFocusAngle = car.angle;
    }

    float shakeX = 0, shakeY = 0;
    if(camShake > 0 && !replayPlayback) {
        shakeX = (randInt()%100 - 50) * camShake * 0.05f;
        shakeY = (randInt()%100 - 50) * camShake * 0.05f;
    }

    ScePspFVector3 eye, center;
    float camDist=6.5f,camHeight=3.2f;
    eye.x=camFocusX-sinf(camFocusAngle)*camDist + shakeX;
    eye.z=camFocusZ-cosf(camFocusAngle)*camDist + shakeY;
    eye.y=getTrackHeight(camFocusX, camFocusZ)+camHeight;
    center.x=camFocusX; center.y=getTrackHeight(camFocusX, camFocusZ)+0.5f; center.z=camFocusZ;

    sceGumMatrixMode(GU_VIEW);sceGumLoadIdentity();
    ScePspFVector3 up={0,1,0};
    sceGumLookAt(&eye,&center,&up);
    sceGumMatrixMode(GU_MODEL);sceGumLoadIdentity();
    sceGumDrawArray(GU_TRIANGLES,GU_VERTEX_32BITF|GU_COLOR_8888|GU_TEXTURE_32BITF|GU_TRANSFORM_3D,trackVertCount,NULL,trackVertices);
    sceGuDisable(GU_TEXTURE_2D);
    drawTraffic();
    // AI
    for(int i=0;i<MAX_AI;i++){
        AIOpponent* a = &ais[i];
        if(a->vertCount == 0) continue;
        ScePspFVector3 aipos={a->x,a->y,a->z};
        sceGumLoadIdentity();
        sceGumTranslate(&aipos);
        ScePspFVector3 airot={0,a->angle,0};
        sceGumRotateXYZ(&airot);
        sceGumDrawArray(GU_TRIANGLES,GU_INDEX_16BIT|GU_VERTEX_32BITF|GU_COLOR_8888|GU_TRANSFORM_3D,a->idxCount,a->idx,a->verts);
    }
    // Игрок
    if(!replayPlayback){
        ScePspFVector3 pos={car.x,car.y,car.z};
        sceGumLoadIdentity();
        sceGumTranslate(&pos);
        ScePspFVector3 rot={0,car.angle+driftAngle*0.3f,0};
        sceGumRotateXYZ(&rot);
        sceGumDrawArray(GU_TRIANGLES,GU_INDEX_16BIT|GU_VERTEX_32BITF|GU_COLOR_8888|GU_TRANSFORM_3D,CAR_IDX_COUNT,carIndices,carVertices);
    } else {
        // Рисуем записанную машину
        ReplayFrame* f = &replayBuf[replayPlaybackIdx];
        ScePspFVector3 pos={f->px, getTrackHeight(f->px, f->pz)+0.4f, f->pz};
        sceGumLoadIdentity();
        sceGumTranslate(&pos);
        ScePspFVector3 rot={0,f->pa,0};
        sceGumRotateXYZ(&rot);
        sceGumDrawArray(GU_TRIANGLES,GU_INDEX_16BIT|GU_VERTEX_32BITF|GU_COLOR_8888|GU_TRANSFORM_3D,CAR_IDX_COUNT,carIndices,carVertices);
        // AI из реплея
        for(int i=0;i<MAX_AI;i++){
            AIOpponent* a = &ais[i];
            if(a->vertCount == 0) continue;
            ScePspFVector3 aipos={f->ax[i], getTrackHeight(f->ax[i], f->az[i])+0.4f, f->az[i]};
            sceGumLoadIdentity();
            sceGumTranslate(&aipos);
            ScePspFVector3 airot={0,f->aa[i],0};
            sceGumRotateXYZ(&airot);
            sceGumDrawArray(GU_TRIANGLES,GU_INDEX_16BIT|GU_VERTEX_32BITF|GU_COLOR_8888|GU_TRANSFORM_3D,a->idxCount,a->idx,a->verts);
        }
    }
    sceGuDisable(GU_FOG);sceGuDisable(GU_DEPTH_TEST);sceGuDisable(GU_CULL_FACE);
    drawWeather(maps[selectedMap].weather);
}

void drawResults(){
    drawRect(80,40,320,200,0xEE000000);
    drawText("RACE RESULTS",170,50,0xFFFFFF00);
    // Строки: имя, время, лучший круг
    // Соберём результаты
    typedef struct { const char* name; float time; float bestLap; int finished; unsigned int color; } Result;
    Result results[MAX_AI+1];
    results[0].name = "YOU";
    results[0].time = playerFinishTime;
    results[0].bestLap = playerBestLap;
    results[0].finished = playerFinished;
    results[0].color = 0xFFFF6060;
    for(int i=0;i<MAX_AI;i++){
        results[i+1].name = ais[i].name;
        results[i+1].time = ais[i].finishTime;
        results[i+1].bestLap = ais[i].bestLap;
        results[i+1].finished = ais[i].finished;
        results[i+1].color = i==0 ? 0xFF66AAFF : (i==1 ? 0xFF66FF88 : 0xFFFFCC66);
    }
    // Сортировка по времени (finished сначала, потом по времени)
    for(int i=0;i<MAX_AI+1-1;i++){
        for(int j=i+1;j<MAX_AI+1;j++){
            int aFin = results[i].finished;
            int bFin = results[j].finished;
            int swap = 0;
            if(aFin && bFin){
                if(results[j].time < results[i].time) swap = 1;
            } else if(bFin && !aFin){
                swap = 1;
            }
            if(swap){
                Result tmp = results[i];
                results[i] = results[j];
                results[j] = tmp;
            }
        }
    }
    // Показываем
    for(int i=0;i<MAX_AI+1;i++){
        float y = 75 + i*32;
        char buf[64];
        sprintf(buf,"%d. %s", i+1, results[i].name);
        drawText(buf, 95, y, results[i].color);
        if(results[i].finished){
            int m=(int)(results[i].time/60); int s=(int)results[i].time%60;
            int ms=(int)((results[i].time-(int)results[i].time)*100);
            sprintf(buf,"%d:%02d.%02d",m,s,ms);
        } else {
            sprintf(buf,"DNF");
        }
        drawText(buf, 300, y, 0xFFFFFFFF);
    }
    drawText("PRESS SQUARE TO CONTINUE",110,225,0xFFAAAAAA);
}

