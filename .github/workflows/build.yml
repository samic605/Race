#define KEY_POINTS 24
static float keyPts[KEY_POINTS][3] = {
    {0,20,0},{15,18,40},{40,16,60},{60,14,40},{50,12,0},{20,10,-20},
    {-20,8,-30},{-50,6,-10},{-60,4,30},{-40,2,70},{0,0,90},{40,-2,80},
    {70,-4,50},{60,-6,10},{30,-8,-20},{-10,-10,-40},{-50,-12,-30},
    {-70,-14,10},{-60,-16,50},{-20,-18,80},{20,-20,90},{50,-22,60},
    {40,-24,20},{0,-26,0}
};
#define TRACK_SEGMENTS 360
#define TRACK_WIDTH 10.0f
typedef struct { float x,y,z,angle; } TrackPoint;
static TrackPoint trackPoints[TRACK_SEGMENTS];
#define MAX_TRACK_VERTS 65535
static Vertex3D trackVertices[MAX_TRACK_VERTS];
static int trackVertCount = 0;

static void addTrackVertex(float x,float y,float z,unsigned int c,float u,float v){
    if(trackVertCount>=MAX_TRACK_VERTS)return;
    trackVertices[trackVertCount].x=x; trackVertices[trackVertCount].y=y; trackVertices[trackVertCount].z=z;
    trackVertices[trackVertCount].color=c; trackVertices[trackVertCount].u=u; trackVertices[trackVertCount].v=v;
    trackVertCount++;
}
static void addTexturedQuad(float x1,float y1,float z1,float x2,float y2,float z2,
                            float x3,float y3,float z3,float x4,float y4,float z4,
                            float u1,float v1,float u2,float v2,unsigned int color){
    addTrackVertex(x1,y1,z1,color,u1,v1); addTrackVertex(x2,y2,z2,color,u2,v1);
    addTrackVertex(x3,y3,z3,color,u2,v2); addTrackVertex(x1,y1,z1,color,u1,v1);
    addTrackVertex(x3,y3,z3,color,u2,v2); addTrackVertex(x4,y4,z4,color,u1,v2);
}
static void addSolidTri(float x1,float y1,float z1,float x2,float y2,float z2,float x3,float y3,float z3,unsigned int color){
    addTrackVertex(x1,y1,z1,color,0,0);
    addTrackVertex(x2,y2,z2,color,0,0);
    addTrackVertex(x3,y3,z3,color,0,0);
}
static void addSolidBox(float cx,float cy,float cz,float sx,float sy,float sz,unsigned int color){
    addTexturedQuad(cx-sx,cy-sy,cz-sz,cx+sx,cy-sy,cz-sz,cx+sx,cy-sy,cz+sz,cx-sx,cy-sy,cz+sz,0,0,1,1,color);
    addTexturedQuad(cx-sx,cy+sy,cz-sz,cx-sx,cy+sy,cz+sz,cx+sx,cy+sy,cz+sz,cx+sx,cy+sy,cz-sz,0,0,1,1,color);
    addTexturedQuad(cx-sx,cy-sy,cz-sz,cx-sx,cy+sy,cz-sz,cx+sx,cy+sy,cz-sz,cx+sx,cy-sy,cz-sz,0,0,1,1,color);
    addTexturedQuad(cx+sx,cy-sy,cz+sz,cx+sx,cy+sy,cz+sz,cx-sx,cy+sy,cz+sz,cx-sx,cy-sy,cz+sz,0,0,1,1,color);
    addTexturedQuad(cx-sx,cy-sy,cz+sz,cx-sx,cy+sy,cz+sz,cx-sx,cy+sy,cz-sz,cx-sx,cy-sy,cz-sz,0,0,1,1,color);
    addTexturedQuad(cx+sx,cy-sy,cz-sz,cx+sx,cy+sy,cz-sz,cx+sx,cy+sy,cz+sz,cx+sx,cy-sy,cz+sz,0,0,1,1,color);
}

static float catmullRom(float p0,float p1,float p2,float p3,float t){
    float t2=t*t,t3=t2*t;
    return 0.5f*((2*p1)+(-p0+p2)*t+(2*p0-5*p1+4*p2-p3)*t2+(-p0+3*p1-3*p2+p3)*t3);
}
void generateTrackPoints(){
    for(int i=0;i<TRACK_SEGMENTS;i++){
        float globalT=(float)i/TRACK_SEGMENTS*KEY_POINTS;
        int seg=(int)globalT; if(seg>=KEY_POINTS)seg=KEY_POINTS-1;
        int i0=(seg-1+KEY_POINTS)%KEY_POINTS,i1=seg,i2=(seg+1)%KEY_POINTS,i3=(seg+2)%KEY_POINTS;
        float t=globalT-seg;
        trackPoints[i].x=catmullRom(keyPts[i0][0],keyPts[i1][0],keyPts[i2][0],keyPts[i3][0],t);
        trackPoints[i].y=catmullRom(keyPts[i0][1],keyPts[i1][1],keyPts[i2][1],keyPts[i3][1],t);
        trackPoints[i].z=catmullRom(keyPts[i0][2],keyPts[i1][2],keyPts[i2][2],keyPts[i3][2],t);
        trackPoints[i].angle=0;
    }
}
float getTrackHeight(float x,float z){
    int best=0;float bd=1e9f;
    for(int i=0;i<TRACK_SEGMENTS;i++){
        float dx=x-trackPoints[i].x,dz=z-trackPoints[i].z,d=dx*dx+dz*dz;
        if(d<bd){bd=d;best=i;}
    }
    return trackPoints[best].y;
}
int findNearestSegment(float x,float z,float*outDist){
    int best=0;float bd=1e9f;
    for(int i=0;i<TRACK_SEGMENTS-1;i++){
        float ax=trackPoints[i].x,az=trackPoints[i].z;
        float bx=trackPoints[i+1].x,bz=trackPoints[i+1].z;
        float abx=bx-ax,abz=bz-az;
        float apx=x-ax,apz=z-az;
        float t=(apx*abx+apz*abz)/(abx*abx+abz*abz);
        if(t<0)t=0;if(t>1)t=1;
        float px=ax+abx*t,pz=az+abz*t;
        float dx=x-px,dz=z-pz,d=dx*dx+dz*dz;
        if(d<bd){bd=d;best=i;}
    }
    if(outDist)*outDist=sqrtf(bd);
    return best;
}
#define U_ASPHALT 0.0f
#define U_GRASS (1.0f/4.0f)
#define U_STONE (2.0f/4.0f)
#define U_BARK (3.0f/4.0f)
#define UV_ONE (1.0f/4.0f)

static void buildTree(float tx,float ty,float tz,float scale){
    float w=0.3f*scale,h=2.5f*scale;
    int trunkSides = 6;
    float trunkR = w;
    unsigned int barkCol = 0xFF5D4037;
    for(int k=0;k<trunkSides;k++){
        float a1 = (float)k/trunkSides*6.2831f;
        float a2 = (float)(k+1)/trunkSides*6.2831f;
        float x1=tx+cosf(a1)*trunkR, z1=tz+sinf(a1)*trunkR;
        float x2=tx+cosf(a2)*trunkR, z2=tz+sinf(a2)*trunkR;
        addTexturedQuad(x1,ty,z1, x2,ty,z2, x2,ty+h,z2, x1,ty+h,z1, U_BARK,0,U_BARK+UV_ONE,1, barkCol);
    }
    unsigned int greens[5] = {0xFF1B5E20,0xFF2E7D32,0xFF388E3C,0xFF43A047,0xFF4CAF50};
    float cy = ty+h;
    for(int lvl=0;lvl<5;lvl++){
        float r = (2.2f - lvl*0.35f) * scale;
        float y0 = cy + lvl*1.2f*scale;
        unsigned int col = greens[lvl];
        for(int k=0;k<6;k++){
            float a1 = (float)k/6.0f*6.2831f;
            float a2 = (float)(k+1)/6.0f*6.2831f;
            float x1=tx+cosf(a1)*r, z1=tz+sinf(a1)*r;
            float x2=tx+cosf(a2)*r, z2=tz+sinf(a2)*r;
            float x1b=tx+cosf(a1)*(r*0.9f), z1b=tz+sinf(a1)*(r*0.9f);
            float x2b=tx+cosf(a2)*(r*0.9f), z2b=tz+sinf(a2)*(r*0.9f);
            addTexturedQuad(x1,y0,z1, x2,y0,z2, x2b,y0+1.2f*scale,z2b, x1b,y0+1.2f*scale,z1b, 0,0,1,1, col);
        }
    }
    addSolidTri(tx-0.5f*scale, cy+6.0f*scale, tz, tx+0.5f*scale, cy+6.0f*scale, tz, tx, cy+6.8f*scale, tz, 0xFF4CAF50);
}
static void buildRock(float rx,float ry,float rz,float size){
    int sides = 8;
    float topY = ry + size*2.0f;
    for(int k=0;k<sides;k++){
        float a1=(float)k/sides*6.2831f;
        float a2=(float)(k+1)/sides*6.2831f;
        float r1 = size * (0.85f + sinf(a1*3.0f)*0.15f);
        float r2 = size * (0.85f + sinf(a2*3.0f)*0.15f);
        float x1=rx+cosf(a1)*r1, z1=rz+sinf(a1)*r1;
        float x2=rx+cosf(a2)*r2, z2=rz+sinf(a2)*r2;
        float x1t=rx+cosf(a1)*r1*0.7f, z1t=rz+sinf(a1)*r1*0.7f;
        float x2t=rx+cosf(a2)*r2*0.7f, z2t=rz+sinf(a2)*r2*0.7f;
        addTexturedQuad(x1,ry,z1, x2,ry,z2, x2t,topY,z2t, x1t,topY,z1t, U_STONE,0,U_STONE+UV_ONE,1, 0xFFAAAAAA);
    }
    for(int k=0;k<sides;k++){
        float a1=(float)k/sides*6.2831f;
        float a2=(float)(k+1)/sides*6.2831f;
        float r1 = size * (0.85f + sinf(a1*3.0f)*0.15f);
        float r2 = size * (0.85f + sinf(a2*3.0f)*0.15f);
        float x1=rx+cosf(a1)*r1*0.7f, z1=rz+sinf(a1)*r1*0.7f;
        float x2=rx+cosf(a2)*r2*0.7f, z2=rz+sinf(a2)*r2*0.7f;
        addSolidTri(rx,topY,rz, x1,topY,z1, x2,topY,z2, 0xFF888888);
    }
}
static void buildStreetLamp(float x, float y, float z, float side){
    float poleH = 4.0f;
    addSolidBox(x, y+poleH/2, z, 0.08f, poleH/2, 0.08f, 0xFF333333);
    addSolidBox(x + side*0.5f, y+poleH, z, 0.5f, 0.05f, 0.05f, 0xFF333333);
    addSolidBox(x + side*1.0f, y+poleH-0.1f, z, 0.15f, 0.08f, 0.15f, 0xFFFFEE88);
    addSolidBox(x + side*1.0f, y+poleH+0.05f, z, 0.18f, 0.03f, 0.18f, 0xFF222222);
}
static void buildTurnSign(float x, float y, float z){
    addSolidBox(x, y+0.4f, z, 0.03f, 0.4f, 0.03f, 0xFF666666);
    float r = 0.25f;
    addSolidTri(x-r, y+0.8f, z, x, y+0.8f+r, z, x+r, y+0.8f, z, 0xFFFFCC00);
    addSolidTri(x-r, y+0.8f, z, x+r, y+0.8f, z, x, y+0.8f-r, z, 0xFFFFCC00);
    addSolidTri(x-r*0.7f, y+0.8f, z-0.01f, x, y+0.8f+r*0.6f, z-0.01f, x+r*0.7f, y+0.8f, z-0.01f, 0xFF000000);
}

void buildTrack(){
    trackVertCount=0; generateTrackPoints();
    for(int i=0;i<TRACK_SEGMENTS-1;i++){
        TrackPoint*p1=&trackPoints[i],*p2=&trackPoints[i+1];
        float dx=p2->x-p1->x,dz=p2->z-p1->z;
        float len=sqrtf(dx*dx+dz*dz);if(len<0.001f)len=1;
        float nx=-dz/len,nz=dx/len;
        float halfW=TRACK_WIDTH/2;
        addTexturedQuad(p1->x-nx*halfW,p1->y,p1->z-nz*halfW,p1->x+nx*halfW,p1->y,p1->z+nz*halfW,
                        p2->x+nx*halfW,p2->y,p2->z+nz*halfW,p2->x-nx*halfW,p2->y,p2->z-nz*halfW,
                        U_ASPHALT,0,U_ASPHALT+UV_ONE,1,0xFFFFFFFF);
        for(int side=-1;side<=1;side+=2){
            float gx1=p1->x+nx*halfW*side,gz1=p1->z+nz*halfW*side;
            float gx2=p1->x+nx*(halfW+3.0f)*side,gz2=p1->z+nz*(halfW+3.0f)*side;
            addTexturedQuad(gx1,p1->y-0.05f,gz1,gx2,p1->y-0.05f,gz2,gx2,p2->y-0.05f,gz2,gx1,p2->y-0.05f,gz1,U_GRASS,0,U_GRASS+UV_ONE,1,0xFFFFFFFF);
        }
        for(int side=-1;side<=1;side+=2){
            addSolidBox((p1->x+p2->x)/2 + nx*(halfW-0.15f)*side, (p1->y+p2->y)/2 + 0.01f, (p1->z+p2->z)/2 + nz*(halfW-0.15f)*side, len/2, 0.005f, 0.08f, 0xFFFFFFFF);
        }
        if(i%2==0){
            addSolidBox((p1->x+p2->x)/2, (p1->y+p2->y)/2+0.01f, (p1->z+p2->z)/2, len/2, 0.005f, 0.08f, 0xFFFFEB3B);
        }
        if(i%30==0 && i>0){
            float arrowX = p1->x + nx*1.5f;
            float arrowZ = p1->z + nz*1.5f;
            addSolidBox(arrowX, p1->y+0.02f, arrowZ, 0.15f, 0.005f, 0.4f, 0xFFFFFFFF);
            addSolidTri(arrowX-0.25f, p1->y+0.02f, arrowZ+0.4f, arrowX+0.25f, p1->y+0.02f, arrowZ+0.4f, arrowX, p1->y+0.02f, arrowZ+0.7f, 0xFFFFFFFF);
        }
        if(i%4==0){
            for(int side=-1;side<=1;side+=2){
                float ox=p1->x+nx*(halfW+0.5f)*side,oz=p1->z+nz*(halfW+0.5f)*side;
                addSolidBox(ox,p1->y+0.4f,oz,0.06f,0.4f,0.06f,0xFF666666);
                addSolidBox(ox,p1->y+0.55f,oz,0.08f,0.06f,0.08f,0xFFAAAAAA);
            }
        }
        if(i%40==0){
            for(int side=-1;side<=1;side+=2){
                float lx=p1->x+nx*(halfW+1.5f)*side;
                float lz=p1->z+nz*(halfW+1.5f)*side;
                buildStreetLamp(lx, p1->y, lz, side);
            }
        }
        if(i%60==0 && i>0){
            float sx=p1->x+nx*(halfW+1.0f);
            float sz=p1->z+nz*(halfW+1.0f);
            buildTurnSign(sx, p1->y, sz);
        }
        if(i%2==0){
            for(int side=-1;side<=1;side+=2){
                float tx=p1->x+nx*(halfW+4.0f+(i%5)*0.6f)*side;
                float tz=p1->z+nz*(halfW+4.0f+(i%5)*0.6f)*side;
                buildTree(tx,p1->y-0.5f,tz,0.7f+(i%4)*0.12f);
            }
        }
        if(i%5==0){
            for(int side=-1;side<=1;side+=2){
                float rx=p1->x+nx*(halfW+2.0f+(i%3)*0.5f)*side;
                float rz=p1->z+nz*(halfW+2.0f+(i%3)*0.5f)*side;
                buildRock(rx,p1->y-0.2f,rz,0.4f+(i%4)*0.2f);
            }
        }
        if(i%3==0){
            for(int side=-1;side<=1;side+=2){
                float bx=p1->x+nx*(halfW+2.8f)*side;
                float bz=p1->z+nz*(halfW+2.8f)*side;
                addSolidBox(bx, p1->y+0.2f, bz, 0.3f, 0.25f, 0.3f, 0xFF2E7D32);
                addSolidBox(bx+0.2f, p1->y+0.15f, bz, 0.2f, 0.2f, 0.2f, 0xFF388E3C);
            }
        }
    }
}

