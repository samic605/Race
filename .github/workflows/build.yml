void resetRace(){
    car.x=trackPoints[0].x; car.z=trackPoints[0].z; car.angle=0; car.speed=0; car.steerAngle=0;
    car.y=getTrackHeight(car.x,car.z)+0.4f;
    buildCarMesh();
    buildAIMeshes();
    buildTaxiMesh();
    buildTruckMesh();
    buildCarTrafficMesh();
    initTraffic();
    resetAI();
    sparkCount=0;
    smokeCount=0;
    carHP = 100.0f;
    nitroAmount = 100.0f;
    driftAngle = 0;
    driftScore = 0;
    comboCount = 0;
    comboTime = 0;
    totalScore = 0;
    camShake = 0;
    raceTime = 0;
    lapTime = 0;
    bestLapTime = 0;
    lapNumber = 0;
    lapStarted = 0;
    lastSegIndex = 0;
    wasDrifting = 0;
    playerFinished = 0;
    raceFinished = 0;
    playerPosition = 1;
    playerFinishTime = 0;
    playerBestLap = 0;
    replayCount = 0;
    replayHead = 0;
    replayPlayback = 0;
    replayPlaybackIdx = 0;
    replayPlaybackTimer = 0;
}

void updateMainMenu(SceCtrlData*pad,SceCtrlData*padPrev,Settings*s,GameState*state){
    int p=pad->Buttons&~padPrev->Buttons;
    if(p&PSP_CTRL_UP){s->selectedIndex--;if(s->selectedIndex<0)s->selectedIndex=2;}
    if(p&PSP_CTRL_DOWN){s->selectedIndex++;if(s->selectedIndex>2)s->selectedIndex=0;}
    if(p&defaultControls.accelerate){
        if(s->selectedIndex==0){*state=STATE_MAP_SELECT;selectedMap=0;}
        else if(s->selectedIndex==2){*state=STATE_SETTINGS;s->selectedIndex=0;}
    }
}
void updateMapSelect(SceCtrlData*pad,SceCtrlData*padPrev,GameState*state){
    int p=pad->Buttons&~padPrev->Buttons;
    if(p&defaultControls.accelerate){
        *state=STATE_RACE;
        buildTrack();
        resetRace();
    }
    if(p&defaultControls.brake)*state=STATE_MAIN_MENU;
}
void updateSettings(SceCtrlData*pad,SceCtrlData*padPrev,Settings*s,GameState*state){
    int p=pad->Buttons&~padPrev->Buttons;
    if(p&PSP_CTRL_UP)s->selectedIndex=0;
    if(p&PSP_CTRL_DOWN)s->selectedIndex=1;
    float step=0.05f;
    if(p&PSP_CTRL_LEFT){if(s->selectedIndex==0)s->musicVolume=fmaxf(0,s->musicVolume-step);else s->sfxVolume=fmaxf(0,s->sfxVolume-step);}
    if(p&PSP_CTRL_RIGHT){if(s->selectedIndex==0)s->musicVolume=fminf(1,s->musicVolume+step);else s->sfxVolume=fminf(1,s->sfxVolume+step);}
    if(p&defaultControls.brake){*state=STATE_MAIN_MENU;s->selectedIndex=2;}
    globalSfxVolume = s->sfxVolume;
}
void updateRace(SceCtrlData*pad,SceCtrlData*padPrev,GameState*state,float dt){
    int p=pad->Buttons&~padPrev->Buttons;
    if(p&PSP_CTRL_SELECT){ resetRace(); return; }
    if(p&defaultControls.lookBack && !raceFinished){ cameraMode = (cameraMode+1)%3; }
    if(raceFinished){
        if(p&defaultControls.brake){ *state = STATE_MAP_SELECT; }
        // реплей
        if(replayPlayback && replayCount > 0){
            replayPlaybackTimer += dt;
            if(replayPlaybackTimer > 1.0f/30.0f){
                replayPlaybackTimer = 0;
                replayPlaybackIdx = (replayPlaybackIdx + 1) % REPLAY_FRAMES;
                // завершить если дошли до head
                int nextIdx = (replayPlaybackIdx + 1) % REPLAY_FRAMES;
                if(nextIdx == replayHead){
                    replayPlaybackIdx = (replayHead - replayCount + REPLAY_FRAMES) % REPLAY_FRAMES;
                }
            }
        }
        return;
    }
    if(carHP <= 0){
        if(p&defaultControls.brake){ resetRace(); }
        return;
    }
    updateCarPhysics(pad,dt);
    updateTraffic(dt);
    updateAI(dt);
    checkTrafficCollision();
    checkAIcollision();
    updateParticles(dt);
    // Запись реплея каждые 2 кадра
    static int replayFrameCounter = 0;
    replayFrameCounter++;
    if(replayFrameCounter % 2 == 0){
        recordReplayFrame();
    }
    if(p&defaultControls.brake)*state=STATE_MAP_SELECT;
}

void initGu(){
    sceGuInit();sceGuStart(GU_DIRECT,list);
    sceGuDrawBuffer(GU_PSM_8888,(void*)0,512);
    sceGuDispBuffer(480,272,(void*)0x88000,512);
    sceGuDepthBuffer((void*)0x110000,512);
    sceGuOffset(2048-(480/2),2048-(272/2));
    sceGuViewport(2048,2048,480,272);
    sceGuScissor(0,0,480,272);
    sceGuEnable(GU_SCISSOR_TEST);
    sceGuDisable(GU_DEPTH_TEST);
    sceGuEnable(GU_BLEND);
    sceGuBlendFunc(GU_ADD,GU_SRC_ALPHA,GU_ONE_MINUS_SRC_ALPHA,0,0);
    sceGuFog(50.0f,180.0f,0xFF87CEEB);
    sceGuFinish();sceGuSync(0,0);
    sceDisplayWaitVblankStart();sceGuDisplay(GU_TRUE);
}

int main(){
    setupExitCallback();
    initGu();generateBasicFont();generateTextures();buildCarMesh();
    initAudio();
    saveLoad();
    Settings settings={0.7f,0.8f,0};
    GameState state=STATE_MAIN_MENU;
    SceCtrlData pad,padPrev;
    memset(&pad,0,sizeof(pad));memset(&padPrev,0,sizeof(padPrev));
    sceCtrlSetSamplingCycle(0);sceCtrlSetSamplingMode(PSP_CTRL_MODE_ANALOG);
    u32 lastTime=sceKernelGetSystemTimeLow();
    const float FIXED_DT=1.0f/60.0f;
    while(1){
        padPrev=pad;sceCtrlReadBufferPositive(&pad,1);
        u32 now=sceKernelGetSystemTimeLow();
        float dt=(now-lastTime)/1000000.0f;lastTime=now;
        if(dt>0.05f)dt=0.05f;if(dt<=0.0f)dt=FIXED_DT;

        if(state==STATE_MAIN_MENU)updateMainMenu(&pad,&padPrev,&settings,&state);
        else if(state==STATE_MAP_SELECT)updateMapSelect(&pad,&padPrev,&state);
        else if(state==STATE_SETTINGS)updateSettings(&pad,&padPrev,&settings,&state);
        else updateRace(&pad,&padPrev,&state,dt);

        sceGuStart(GU_DIRECT,list);
        sceGuClearColor(0xFF87CEEB);
        sceGuClear(GU_COLOR_BUFFER_BIT|GU_DEPTH_BUFFER_BIT);

        if(state==STATE_RACE){drawRaceScene();drawRaceHUD();}
        else{
            if(state==STATE_MAIN_MENU)drawMainMenu(&settings);
            else if(state==STATE_MAP_SELECT)drawMapSelect();
            else drawSettings(&settings);
        }
        sceGuFinish();sceGuSync(0,0);
        audioMix();
        sceDisplayWaitVblankStart();sceGuSwapBuffers();
    }
    sceGuTerm();return 0;
}
