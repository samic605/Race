static unsigned int carColorAccent = 0xFFFF6B6B;
static unsigned int carColorDark = 0xFF2C3E50;

void buildCarMeshEx(Vertex3D* outVerts, unsigned short* outIdx, int* outVertCount, int* outIdxCount, unsigned int mainColor, unsigned int accentColor){
    Vertex3D savedVerts[MAX_CAR_VERTS];
    unsigned short savedIdx[MAX_CAR_INDICES];
    int savedVertCount = carVertCount;
    int savedIdxCount = carIdxCount;
    memcpy(savedVerts, carVertices, sizeof(Vertex3D)*carVertCount);
    memcpy(savedIdx, carIndices, sizeof(unsigned short)*carIdxCount);
    carVertCount = 0; carIdxCount = 0;

    CarProfile profiles[PROFILE_COUNT];
    memcpy(profiles, carProfiles, sizeof(carProfiles));
    for(int i=0;i<PROFILE_COUNT;i++){
        if(i < 2 || i >= 6) profiles[i].color = mainColor;
        else if(i == 2 || i == PROFILE_COUNT-2) profiles[i].color = accentColor;
        else profiles[i].color = carColorDark;
    }
    profiles[0].color = mainColor; profiles[1].color = mainColor;
    profiles[2].color = accentColor; profiles[3].color = carColorDark;
    profiles[4].color = carColorDark; profiles[5].color = carColorDark;
    profiles[6].color = accentColor; profiles[7].color = mainColor;

    for(int i=0;i<PROFILE_COUNT-1;i++) connectProfiles(&profiles[i],&profiles[i+1]);
    closeProfile(&profiles[0],1); closeProfile(&profiles[PROFILE_COUNT-1],0);

    buildWheel(-0.95f,0.3f,1.4f,0.35f,0.25f,0xFF111111); buildWheel(0.95f,0.3f,1.4f,0.35f,0.25f,0xFF111111);
    buildWheel(-0.95f,0.3f,-1.4f,0.35f,0.25f,0xFF111111); buildWheel(0.95f,0.3f,-1.4f,0.35f,0.25f,0xFF111111);

    addBox(-0.55f, 0.45f, 2.42f, 0.18f, 0.08f, 0.02f, 0xFFFFFDE7);
    addBox( 0.55f, 0.45f, 2.42f, 0.18f, 0.08f, 0.02f, 0xFFFFFDE7);
    addBox(-0.6f, 0.55f, -2.02f, 0.2f, 0.08f, 0.02f, 0xFFFF0000);
    addBox( 0.6f, 0.55f, -2.02f, 0.2f, 0.08f, 0.02f, 0xFFFF0000);
    addBox(0, 0.4f, -2.03f, 0.25f, 0.1f, 0.01f, 0xFFFFEE00);
    addBox(0, 0.4f, 2.43f, 0.5f, 0.15f, 0.02f, 0xFF222222);
    for(int i=-2;i<=2;i++) addBox(i*0.15f, 0.4f, 2.44f, 0.02f, 0.13f, 0.01f, 0xFF888888);
    addBox(-0.95f, 0.7f, 0.9f, 0.1f, 0.05f, 0.12f, mainColor);
    addBox( 0.95f, 0.7f, 0.9f, 0.1f, 0.05f, 0.12f, mainColor);
    addBox(-1.02f, 0.72f, 0.9f, 0.01f, 0.04f, 0.1f, 0xFFAACCFF);
    addBox( 1.02f, 0.72f, 0.9f, 0.01f, 0.04f, 0.1f, 0xFFAACCFF);
    addBox(0, 0.95f, -1.85f, 0.9f, 0.03f, 0.2f, 0xFF222222);
    addBox(-0.7f, 0.9f, -1.85f, 0.05f, 0.1f, 0.15f, 0xFF222222);
    addBox( 0.7f, 0.9f, -1.85f, 0.05f, 0.1f, 0.15f, 0xFF222222);
    addBox(0.4f, 0.2f, -2.05f, 0.08f, 0.06f, 0.08f, 0xFF888888);
    addBox(0.4f, 0.2f, -2.10f, 0.1f, 0.08f, 0.02f, 0xFF444444);
    addBox(-0.5f, 1.15f, -0.5f, 0.015f, 0.25f, 0.015f, 0xFF333333);
    addBox(-0.5f, 1.42f, -0.5f, 0.03f, 0.03f, 0.03f, 0xFFFF0000);
    addBox(-0.92f, 0.5f, 2.0f, 0.02f, 0.06f, 0.08f, 0xFFFFAA00);
    addBox( 0.92f, 0.5f, 2.0f, 0.02f, 0.06f, 0.08f, 0xFFFFAA00);
    addBox(0, 0.87f, 1.5f, 0.25f, 0.02f, 0.15f, 0xFF222222);
    addBox(-0.91f, 0.35f, 0, 0.02f, 0.05f, 3.5f, 0xFF444444);
    addBox( 0.91f, 0.35f, 0, 0.02f, 0.05f, 3.5f, 0xFF444444);

    memcpy(outVerts, carVertices, sizeof(Vertex3D)*carVertCount);
    memcpy(outIdx, carIndices, sizeof(unsigned short)*carIdxCount);
    *outVertCount = carVertCount;
    *outIdxCount = carIdxCount;

    carVertCount = savedVertCount;
    carIdxCount = savedIdxCount;
    memcpy(carVertices, savedVerts, sizeof(Vertex3D)*savedVertCount);
    memcpy(carIndices, savedIdx, sizeof(unsigned short)*savedIdxCount);
}

void buildCarMesh(){
    buildCarMeshEx(carVertices, carIndices, &carVertCount, &carIdxCount, 0xFFE94560, 0xFFFF6B6B);
    memcpy(carOriginalVertices, carVertices, sizeof(Vertex3D) * carVertCount);
    carDamage = 0;
}
#define CAR_VERT_COUNT carVertCount
#define CAR_IDX_COUNT carIdxCount

void deformCar(float damageDelta, float hitDirX, float hitDirZ) {
    if (damageDelta <= 0.0f) return;
    carDamage += damageDelta;
    if (carDamage > 1.0f) carDamage = 1.0f;
    for (int i = 0; i < carVertCount; i++) {
        Vertex3D *v = &carVertices[i];
        Vertex3D *orig = &carOriginalVertices[i];
        float zWeight = (orig->z > 0.5f) ? (orig->z / 2.4f) : 0.0f;
        if (zWeight > 1.0f) zWeight = 1.0f;
        float xWeight = fabsf(orig->x) / 1.0f;
        if (xWeight > 1.0f) xWeight = 1.0f;
        float dirWeight = fabsf(hitDirZ) * zWeight + fabsf(hitDirX) * xWeight;
        if (dirWeight > 1.0f) dirWeight = 1.0f;
        float deformWeight = carDamage * dirWeight;
        v->x = orig->x + hitDirX * deformWeight * 0.7f;
        v->z = orig->z + hitDirZ * deformWeight * 0.7f;
        v->y = orig->y - deformWeight * 0.2f;
        v->x += sinf((float)i * 3.14f) * deformWeight * 0.12f;
        v->y += cosf((float)i * 2.71f) * deformWeight * 0.06f;
    }
}

// ============================================================
// AI-СОПЕРНИКИ (3 штуки)
// ============================================================
#define MAX_AI 3
#define MAX_AI_VERTS 4096
#define MAX_AI_INDICES 8192

typedef struct {
    float x, z, y;
    float angle;
    float speed;
    int lapNumber;
    int targetLap;
    float lapTime;
    float bestLap;
    int lastSegIndex;
    int segIndex;
    float skill;
    float wobble;
    int finished;
    float finishTime;
    float totalTime;
    // Меш
    Vertex3D* verts;
    Vertex3D* origVerts;
    unsigned short* idx;
    int vertCount;
    int idxCount;
    float damage;
    unsigned int colorMain;
    unsigned int colorAccent;
    const char* name;
    int passed; // для детекта обгона
    float lastSeg;
} AIOpponent;

static AIOpponent ais[MAX_AI];

// Глобальные массивы для 3 AI
static Vertex3D aiVertArrays[MAX_AI][MAX_AI_VERTS];
static Vertex3D aiOrigVertArrays[MAX_AI][MAX_AI_VERTS];
static unsigned short aiIdxArrays[MAX_AI][MAX_AI_INDICES];

void buildAIMeshes(){
    ais[0].verts = aiVertArrays[0]; ais[0].origVerts = aiOrigVertArrays[0]; ais[0].idx = aiIdxArrays[0];
    ais[0].colorMain = 0xFF2980B9; ais[0].colorAccent = 0xFF6FC3FF; ais[0].name = "RIVAL 1";
    buildCarMeshEx(ais[0].verts, ais[0].idx, &ais[0].vertCount, &ais[0].idxCount, ais[0].colorMain, ais[0].colorAccent);
    memcpy(ais[0].origVerts, ais[0].verts, sizeof(Vertex3D)*ais[0].vertCount);

    ais[1].verts = aiVertArrays[1]; ais[1].origVerts = aiOrigVertArrays[1]; ais[1].idx = aiIdxArrays[1];
    ais[1].colorMain = 0xFF27AE60; ais[1].colorAccent = 0xFF6FE3A0; ais[1].name = "RIVAL 2";
    buildCarMeshEx(ais[1].verts, ais[1].idx, &ais[1].vertCount, &ais[1].idxCount, ais[1].colorMain, ais[1].colorAccent);
    memcpy(ais[1].origVerts, ais[1].verts, sizeof(Vertex3D)*ais[1].vertCount);

    ais[2].verts = aiVertArrays[2]; ais[2].origVerts = aiOrigVertArrays[2]; ais[2].idx = aiIdxArrays[2];
    ais[2].colorMain = 0xFFF39C12; ais[2].colorAccent = 0xFFFFCE7A; ais[2].name = "RIVAL 3";
    buildCarMeshEx(ais[2].verts, ais[2].idx, &ais[2].vertCount, &ais[2].idxCount, ais[2].colorMain, ais[2].colorAccent);
    memcpy(ais[2].origVerts, ais[2].verts, sizeof(Vertex3D)*ais[2].vertCount);
}

void deformAI(int i, float damageDelta, float hitDirX, float hitDirZ) {
    AIOpponent* a = &ais[i];
    if (damageDelta <= 0.0f) return;
    a->damage += damageDelta;
    if (a->damage > 1.0f) a->damage = 1.0f;
    for (int v=0; v < a->vertCount; v++) {
        Vertex3D *vp = &a->verts[v];
        Vertex3D *orig = &a->origVerts[v];
        float zWeight = (orig->z > 0.5f) ? (orig->z / 2.4f) : 0.0f;
        if (zWeight > 1.0f) zWeight = 1.0f;
        float xWeight = fabsf(orig->x) / 1.0f;
        if (xWeight > 1.0f) xWeight = 1.0f;
        float dirWeight = fabsf(hitDirZ) * zWeight + fabsf(hitDirX) * xWeight;
        if (dirWeight > 1.0f) dirWeight = 1.0f;
        float dw = a->damage * dirWeight;
        vp->x = orig->x + hitDirX * dw * 0.7f;
        vp->z = orig->z + hitDirZ * dw * 0.7f;
        vp->y = orig->y - dw * 0.2f;
        vp->x += sinf((float)v * 3.14f) * dw * 0.12f;
        vp->y += cosf((float)v * 2.71f) * dw * 0.06f;
    }
}

void resetAI(){
    for(int i=0;i<MAX_AI;i++){
        AIOpponent* a = &ais[i];
        int segStart = (TRACK_SEGMENTS/2) + i * 8;
        if(segStart >= TRACK_SEGMENTS) segStart -= TRACK_SEGMENTS;
        a->segIndex = segStart;
        a->lastSegIndex = segStart;
        a->lastSeg = (float)segStart;
        a->x = trackPoints[segStart].x;
        a->z = trackPoints[segStart].z;
        a->y = getTrackHeight(a->x, a->z) + 0.4f;
        // угол по направлению трассы
        int ns = (segStart + 1) % TRACK_SEGMENTS;
        float dx = trackPoints[ns].x - trackPoints[segStart].x;
        float dz = trackPoints[ns].z - trackPoints[segStart].z;
        a->angle = atan2f(dx, dz);
        a->speed = 0;
        a->lapNumber = 0;
        a->targetLap = 3;
        a->lapTime = 0;
        a->bestLap = 0;
        a->totalTime = 0;
        a->skill = 0.88f + i*0.04f + (randInt()%100)/1500.0f;
        a->wobble = 0;
        a->finished = 0;
        a->finishTime = 0;
        a->damage = 0;
        a->passed = 0;
    }
}

float aiTargetSpeed(int aiIdx, int seg){
    AIOpponent* a = &ais[aiIdx];
    int look = 15;
    int s2 = (seg + look) % TRACK_SEGMENTS;
    float dx1 = trackPoints[(seg+5)%TRACK_SEGMENTS].x - trackPoints[seg].x;
    float dz1 = trackPoints[(seg+5)%TRACK_SEGMENTS].z - trackPoints[seg].z;
    float dx2 = trackPoints[s2].x - trackPoints[(seg+5)%TRACK_SEGMENTS].x;
    float dz2 = trackPoints[s2].z - trackPoints[(seg+5)%TRACK_SEGMENTS].z;
    float cross = fabsf(dx1*dz2 - dz1*dx2);
    float curve = cross / (look * look);
    float baseSpeed = MAX_SPEED * 0.95f * a->skill;
    float slow = 1.0f - curve * 0.8f;
    if(slow < 0.4f) slow = 0.4f;
    return baseSpeed * slow;
}

// AI объезжает трафик
void aiAvoidTraffic(AIOpponent* a, int aiIdx){
    float avoidX = 0, avoidZ = 0;
    float avoidStrength = 0;
    for(int i=0;i<MAX_TRAFFIC;i++){
        if(!traffic[i].active) continue;
        float tdx = traffic[i].x - a->x;
        float tdz = traffic[i].z - a->z;
        float td = sqrtf(tdx*tdx + tdz*tdz);
        if(td > 10.0f || td < 0.01f) continue;
        float forwardDot = tdx * sinf(a->angle) + tdz * cosf(a->angle);
        if(forwardDot <= 0) continue;
        float side = tdx * cosf(a->angle) - tdz * sinf(a->angle);
        float strength = (10.0f - td) / 10.0f;
        if(side > 0) avoidX -= strength * 2.0f; // уйти влево
        else avoidX += strength * 2.0f;         // уйти вправо
        avoidStrength += strength;
    }
    // Применяем смещение
    if(avoidStrength > 0){
        float perpX = cosf(a->angle);
        float perpZ = -sinf(a->angle);
        float shift = avoidX * 0.5f;
        a->x += perpX * shift;
        a->z += perpZ * shift;
    }
}

void updateAI(float dt){
    for(int i=0;i<MAX_AI;i++){
        AIOpponent* a = &ais[i];
        if(a->finished) continue;

        float dummy;
        int seg = findNearestSegment(a->x, a->z, &dummy);
        a->segIndex = seg;

        int nextSeg = (seg + 1) % TRACK_SEGMENTS;
        float targetX = trackPoints[nextSeg].x;
        float targetZ = trackPoints[nextSeg].z;
        float dx = targetX - a->x;
        float dz = targetZ - a->z;
        float dist = sqrtf(dx*dx + dz*dz);
        if(dist < 0.001f) dist = 0.001f;

        float targetAngle = atan2f(dx, dz);
        float angleDiff = targetAngle - a->angle;
        while(angleDiff > 3.14159f) angleDiff -= 6.28318f;
        while(angleDiff < -3.14159f) angleDiff += 6.28318f;
        float turnRate = 2.5f * dt;
        if(angleDiff > turnRate) angleDiff = turnRate;
        if(angleDiff < -turnRate) angleDiff = -turnRate;
        a->angle += angleDiff;

        float ts = aiTargetSpeed(i, seg);

        // Замедление перед трафиком
        for(int t=0;t<MAX_TRAFFIC;t++){
            if(!traffic[t].active) continue;
            float tdx = traffic[t].x - a->x;
            float tdz = traffic[t].z - a->z;
            float td = sqrtf(tdx*tdx + tdz*tdz);
            if(td < 6.0f){
                float forwardDot = tdx * sinf(a->angle) + tdz * cosf(a->angle);
                if(forwardDot > 0) ts *= 0.55f;
            }
        }

        if(a->speed < ts) a->speed += 15.0f * dt;
        else a->speed -= 25.0f * dt;
        if(a->speed > MAX_SPEED) a->speed = MAX_SPEED;
        if(a->speed < 0) a->speed = 0;

        float newX = a->x + sinf(a->angle) * a->speed * dt;
        float newZ = a->z + cosf(a->angle) * a->speed * dt;
        a->x = newX;
        a->z = newZ;
        a->y = getTrackHeight(a->x, a->z) + 0.4f;

        a->wobble += dt * 2.0f;
        float wobbleOffset = sinf(a->wobble) * 0.15f;
        a->x += wobbleOffset * cosf(a->angle) * dt * 3.0f;
        a->z -= wobbleOffset * sinf(a->angle) * dt * 3.0f;

        // Объезд трафика
        aiAvoidTraffic(a, i);

        // Круги
        if(a->lastSegIndex > TRACK_SEGMENTS - 30 && seg < 30){
            if(a->lapNumber > 0){
                if(a->bestLap == 0 || a->lapTime < a->bestLap) a->bestLap = a->lapTime;
            }
            a->lapNumber++;
            a->lapTime = 0;
            if(a->lapNumber >= a->targetLap){
                a->finished = 1;
                a->finishTime = a->totalTime;
            }
        }
        a->lastSegIndex = seg;

        a->lapTime += dt;
        a->totalTime += dt;
    }
}

// ============================================================
// ВСТРЕЧНЫЙ ТРАФИК
// ============================================================
#define MAX_TRAFFIC 6
#define TRAFFIC_TYPE_TAXI 0
#define TRAFFIC_TYPE_TRUCK 1
#define TRAFFIC_TYPE_CAR 2

#define MAX_TRAFFIC_VERTS 2048
#define MAX_TRAFFIC_INDICES 4096
static Vertex3D trafficVertices[3][MAX_TRAFFIC_VERTS];
static Vertex3D trafficOriginalVertices[3][MAX_TRAFFIC_VERTS];
static unsigned short trafficIndices[3][MAX_TRAFFIC_INDICES];
static int trafficVertCount[3] = {0,0,0};
static int trafficIdxCount[3] = {0,0,0};

static int tAddVertex(int type, float x,float y,float z,unsigned int c){
    if(trafficVertCount[type]>=MAX_TRAFFIC_VERTS)return -1;
    trafficVertices[type][trafficVertCount[type]].x=x;
    trafficVertices[type][trafficVertCount[type]].y=y;
    trafficVertices[type][trafficVertCount[type]].z=z;
    trafficVertices[type][trafficVertCount[type]].color=c;
    trafficVertices[type][trafficVertCount[type]].u=0;
    trafficVertices[type][trafficVertCount[type]].v=0;
    return trafficVertCount[type]++;
}
static void tAddTriangle(int type,int a,int b,int c){
    if(trafficIdxCount[type]+3>MAX_TRAFFIC_INDICES)return;
    trafficIndices[type][trafficIdxCount[type]++]=(unsigned short)a;
    trafficIndices[type][trafficIdxCount[type]++]=(unsigned short)b;
    trafficIndices[type][trafficIdxCount[type]++]=(unsigned short)c;
}
static void tAddQuad(int type,int a,int b,int c,int d){ tAddTriangle(type,a,b,c); tAddTriangle(type,a,c,d); }
static void tAddBox(int type, float cx,float cy,float cz,float sx,float sy,float sz,unsigned int color){
    int base = trafficVertCount[type];
    tAddVertex(type,cx-sx,cy-sy,cz-sz,color); tAddVertex(type,cx+sx,cy-sy,cz-sz,color);
    tAddVertex(type,cx+sx,cy-sy,cz+sz,color); tAddVertex(type,cx-sx,cy-sy,cz+sz,color);
    tAddVertex(type,cx-sx,cy+sy,cz-sz,color); tAddVertex(type,cx+sx,cy+sy,cz-sz,color);
    tAddVertex(type,cx+sx,cy+sy,cz+sz,color); tAddVertex(type,cx-sx,cy+sy,cz+sz,color);
    tAddQuad(type,base+0,base+1,base+2,base+3); tAddQuad(type,base+4,base+7,base+6,base+5);
    tAddQuad(type,base+0,base+4,base+5,base+1); tAddQuad(type,base+2,base+6,base+7,base+3);
    tAddQuad(type,base+0,base+3,base+7,base+4); tAddQuad(type,base+1,base+5,base+6,base+2);
}
static void tAddWheel(int type,float cx,float cy,float cz,float r,float w,unsigned int color){
    const int S=12; int base=trafficVertCount[type];
    for(int side=0;side<2;side++){
        float zo=(side==0)?-w/2:w/2;
        for(int i=0;i<S;i++){float a=(float)i/S*2.0f*3.14159f;tAddVertex(type,cx+cosf(a)*r,cy+sinf(a)*r,cz+zo,color);}
    }
    for(int i=0;i<S;i++){int n=(i+1)%S;tAddQuad(type,base+i,base+n,base+S+n,base+S+i);}
    for(int side=0;side<2;side++){
        int c=tAddVertex(type,cx,cy,cz+(side==0?-w/2:w/2),0xFF222222);
        int rb=base+side*S;
        for(int i=0;i<S;i++){int n=(i+1)%S;if(side==0)tAddTriangle(type,c,rb+n,rb+i);else tAddTriangle(type,c,rb+i,rb+n);}
    }
}

static void buildTaxiMesh(){
