static void generateBasicFont(){
    memset(font,0,sizeof(font));
    for(int i=0;i<128;i++)fontwidthtab[i]=16;
    for(int c=32;c<128;c++){
        int idx=-1;
        if(c>='A'&&c<='Z')idx=c-'A';
        else if(c>='0'&&c<='9')idx=26+(c-'0');
        else if(c==' ')idx=36;
        else if(c=='!')idx=37;
        else if(c=='?')idx=38;
        else if(c==':')idx=39;
        else if(c==';')idx=40;
        else if(c==',')idx=41;
        else if(c=='-')idx=42;
        else if(c=='.')idx=43;
        else if(c=='/')idx=44;
        else if(c=='%')idx=45;
        else continue;
        int tx=(c&0x0F)*16,ty=(c>>4)*16;
        for(int row=0;row<8;row++){unsigned char bits=charBitmaps[idx][row];
            for(int col=0;col<8;col++)if(bits&(1<<(7-col)))
                for(int dy=0;dy<2;dy++)for(int dx=0;dx<2;dx++)
                    font[(ty+row*2+dy)*FONT_W+(tx+col*2+dx)]=0xFFFFFFFF;}
    }
}

