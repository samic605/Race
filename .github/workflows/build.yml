#define REPLAY_FRAMES 600   // ~10 секунд при 60 FPS
typedef struct {
    float px, pz, pa;
    float ax[MAX_AI], az[MAX_AI], aa[MAX_AI];
} ReplayFrame;
static ReplayFrame replayBuf[REPLAY_FRAMES];
static int replayCount = 0;
static int replayHead = 0;
static int replayPlayback = 0;
static int replayPlaybackIdx = 0;
static float replayPlaybackTimer = 0;

void recordReplayFrame(){
    ReplayFrame* f = &replayBuf[replayHead];
    f->px = car.x; f->pz = car.z; f->pa = car.angle;
    for(int i=0;i<MAX_AI;i++){
        f->ax[i] = ais[i].x; f->az[i] = ais[i].z; f->aa[i] = ais[i].angle;
    }
    replayHead = (replayHead + 1) % REPLAY_FRAMES;
    if(replayCount < REPLAY_FRAMES) replayCount++;
}

// ============================================================
// ФИЗИКА ИГРОКА
// ============================================================
typedef struct { float x,z,angle,speed,steerAngle,y; } CarState;
static CarState car = {0};
#define MAX_SPEED 22.0f
#define ACCELERATION 14.0f
#define BRAKING 22.0f
#define FRICTION 4.0f
#define TURN_SPEED 2.2f
#define STEER_SMOOTHING 0.15f
#define NITRO_MAX_SPEED 32.0f
#define NITRO_ACCEL 30.0f
#define NITRO_DRAIN 30.0f
#define NITRO_RECHARGE 12.0f

static float camShake = 0.0f;
static float raceTime = 0.0f;
static float lapTime = 0.0f;
static float bestLapTime = 0.0f;
static int lapNumber = 0;
static int totalLaps = 3;
static int lastSegIndex = 0;
static int lapStarted = 0;
static int cameraMode = 0;
static int playerFinished = 0;
static int raceFinished = 0;
static int playerPosition = 1;
static float playerFinishTime = 0;
static float playerBestLap = 0;

void checkAIcollision(){
    for(int i=0;i<MAX_AI;i++){
        AIOpponent* a = &ais[i];
        float dx = car.x - a->x;
        float dz = car.z - a->z;
        float dist = sqrtf(dx*dx + dz*dz);
        if(dist < 2.8f && dist > 0.01f){
            float hitDirX = dx / dist;
            float hitDirZ = dz / dist;
            float relSpeed = fabsf(car.speed - a->speed);
            float damageDelta = relSpeed / (MAX_SPEED * 2.0f);
            if(damageDelta < 0.05f) damageDelta = 0.05f;
            deformCar(damageDelta, hitDirX, hitDirZ);
            deformAI(i, damageDelta, -hitDirX, -hitDirZ);
            carHP -= damageDelta * 30.0f;
            if(carHP < 0) carHP = 0;
            sfxImpact(damageDelta);
            camShake = 0.3f;
            spawnSparks((car.x + a->x)/2, car.y+0.5f, (car.z + a->z)/2, hitDirX, hitDirZ, 10);
            car.speed *= 0.5f;
            a->speed *= 0.5f;
            car.x += hitDirX * 0.8f;
            car.z += hitDirZ * 0.8f;
            a->x -= hitDirX * 0.8f;
            a->z -= hitDirZ * 0.8f;
        }
    }
}

void updateCarPhysics(SceCtrlData *pad,float dt){
    float ts=getSteering(pad);
    car.steerAngle+=(ts-car.steerAngle)*STEER_SMOOTHING;
    int acc=(pad->Buttons&defaultControls.accelerate)!=0;
    int brk=(pad->Buttons&defaultControls.brake)!=0;
    int handbrake = (pad->Buttons & defaultControls.handbrake) != 0;

    int nitroWant = (pad->Buttons & defaultControls.nitro) != 0;
    if(nitroWant && nitroAmount > 0 && car.speed > 2.0f){
        if(!nitroActive) sfxNitro();
        nitroActive = 1;
        nitroAmount -= NITRO_DRAIN * dt;
        if(nitroAmount < 0) nitroAmount = 0;
        car.speed += NITRO_ACCEL * dt;
        if(car.speed > NITRO_MAX_SPEED) car.speed = NITRO_MAX_SPEED;
        if(randInt()%2==0) spawnSparks(
            car.x - sinf(car.angle)*2.2f, car.y+0.3f, car.z - cosf(car.angle)*2.2f,
            -sinf(car.angle), -cosf(car.angle), 1);
    } else {
        nitroActive = 0;
        if(nitroAmount < 100.0f) nitroAmount += NITRO_RECHARGE * dt;
        if(nitroAmount > 100.0f) nitroAmount = 100.0f;
    }

    if(acc)car.speed+=ACCELERATION*dt;
    else if(brk){
        if(car.speed > 0.5f) car.speed-=BRAKING*dt;
        else car.speed-=ACCELERATION*0.5f*dt;
    }
    else{if(car.speed>0)car.speed-=FRICTION*dt;else if(car.speed<0)car.speed+=FRICTION*dt;}

    float maxSpd = nitroActive ? NITRO_MAX_SPEED : MAX_SPEED;
    if(car.speed>maxSpd)car.speed=maxSpd;
    if(car.speed<-MAX_SPEED*0.3f)car.speed=-MAX_SPEED*0.3f;
    if(fabsf(car.speed)<0.01f)car.speed=0;

    int drifting = (handbrake && fabsf(car.speed) > 6.0f && fabsf(ts) > 0.3f);
    if(drifting){
        if(!wasDrifting){ sfxDriftIn(); wasDrifting = 1; }
        driftAngle += ts * dt * 1.8f;
        if(driftAngle > 0.6f) driftAngle = 0.6f;
        if(driftAngle < -0.6f) driftAngle = -0.6f;
        driftScore += fabsf(car.speed) * fabsf(ts) * dt * 30.0f;
        if(randInt()%2==0) spawnSmoke(car.x - sinf(car.angle)*1.4f - cosf(car.angle)*0.9f, car.y, car.z - cosf(car.angle)*1.4f + sinf(car.angle)*0.9f, 1);
        if(randInt()%2==0) spawnSmoke(car.x - sinf(car.angle)*1.4f + cosf(car.angle)*0.9f, car.y, car.z - cosf(car.angle)*1.4f - sinf(car.angle)*0.9f, 1);
    } else {
        if(wasDrifting){ sfxDriftOut(); wasDrifting = 0; }
        driftAngle *= 0.9f;
        if(fabsf(driftAngle) < 0.02f) driftAngle = 0;
    }

    if(fabsf(car.speed)>0.5f){
        float tf=car.speed/MAX_SPEED;
        float turnRate = TURN_SPEED * tf;
        if(handbrake && fabsf(car.speed) > 6.0f) turnRate *= 0.55f;
        car.angle+=car.steerAngle*turnRate*dt;
    }

    float moveAngle = car.angle + driftAngle;
    float newX=car.x+sinf(moveAngle)*car.speed*dt;
    float newZ=car.z+cosf(moveAngle)*car.speed*dt;
    float distToTrack;
    findNearestSegment(newX,newZ,&distToTrack);
    float halfW=TRACK_WIDTH/2;
    if(distToTrack>halfW-0.5f){
        float impactSpeed=fabsf(car.speed);
        float damageDelta=impactSpeed/MAX_SPEED;
        if(damageDelta>0.5f)damageDelta=0.5f;
        int seg=findNearestSegment(newX,newZ,NULL);
        float trackX=trackPoints[seg].x,trackZ=trackPoints[seg].z;
        float toTrackX=trackX-newX,toTrackZ=trackZ-newZ;
        float len=sqrtf(toTrackX*toTrackX+toTrackZ*toTrackZ);
        if(len>0.001f){toTrackX/=len;toTrackZ/=len;}
        if(impactSpeed>3.0f){
            deformCar(damageDelta,toTrackX,toTrackZ);
            carHP -= damageDelta * 30.0f;
            if(carHP < 0) carHP = 0;
            comboCount = 0;
            spawnSparks(newX-toTrackX*0.5f,car.y+0.5f,newZ-toTrackZ*0.5f,-toTrackX,-toTrackZ,8);
            sfxImpact(damageDelta);
            camShake = 0.3f;
        }
        car.speed*=0.5f;
        if(len>0.001f){newX+=toTrackX*0.5f;newZ+=toTrackZ*0.5f;}
    }
    car.x=newX;car.z=newZ;
    car.y=getTrackHeight(car.x,car.z)+0.4f;

    if(driftScore > 1.0f) comboTime = 2.0f;
    if(comboTime > 0){
        comboTime -= dt;
        if(comboTime <= 0){
            totalScore += (int)driftScore;
            driftScore = 0;
            comboCount = 0;
        }
    }

    if(camShake > 0) camShake -= dt * 2.0f;
    if(camShake < 0) camShake = 0;
    raceTime += dt;
    lapTime += dt;

    int segNow = findNearestSegment(car.x, car.z, NULL);
    if(lapStarted && lastSegIndex > TRACK_SEGMENTS - 30 && segNow < 30){
        if(lapNumber == 1 || bestLapTime == 0 || lapTime < bestLapTime){
            bestLapTime = lapTime;
        }
        if(lapNumber < totalLaps){
            lapNumber++;
            lapTime = 0;
        } else {
            playerFinished = 1;
            raceFinished = 1;
            playerFinishTime = raceTime;
            playerBestLap = bestLapTime;
            if(totalScore > saveData.bestScore) saveData.bestScore = totalScore;
            int lapMs = (int)(bestLapTime * 1000.0f);
            if(saveData.bestLapMs == 0 || lapMs < saveData.bestLapMs) saveData.bestLapMs = lapMs;
            saveData.totalRaces++;
            saveSave();
            // запуск реплея
            replayPlayback = 1;
            replayPlaybackIdx = replayHead - replayCount;
            if(replayPlaybackIdx < 0) replayPlaybackIdx += REPLAY_FRAMES;
            replayPlaybackTimer = 0;
        }
    }
    if(lapStarted == 0 && segNow > 5){
        lapStarted = 1;
        lapNumber = 1;
        lapTime = 0;
        bestLapTime = 0;
    }
    lastSegIndex = segNow;

    // Позиция: 1 + число AI впереди
    int ahead = 0;
    for(int i=0;i<MAX_AI;i++){
        if(ais[i].lapNumber > lapNumber) ahead++;
        else if(ais[i].lapNumber == lapNumber && ais[i].segIndex > segNow) ahead++;
    }
    playerPosition = 1 + ahead;
}

// ============================================================
// МАППИНГ
// ============================================================
typedef struct { unsigned int accelerate,brake,handbrake,nitro,lookBack,pause; } Controls;
static Controls defaultControls={
    .accelerate=PSP_CTRL_CROSS,.brake=PSP_CTRL_SQUARE,.handbrake=PSP_CTRL_CIRCLE,
    .nitro=PSP_CTRL_RTRIGGER,.lookBack=PSP_CTRL_LTRIGGER,.pause=PSP_CTRL_START
};
#define STICK_DEADZONE 20
#define STICK_CENTER 128
float getSteering(SceCtrlData *pad){
    int raw=pad->Lx-STICK_CENTER;
    if(raw>-STICK_DEADZONE&&raw<STICK_DEADZONE)return 0;
    if(raw>0)return(float)(raw-STICK_DEADZONE)/(STICK_CENTER-STICK_DEADZONE);
    return(float)(raw+STICK_DEADZONE)/(STICK_CENTER-STICK_DEADZONE);
}

