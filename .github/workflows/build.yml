#define TEX_SIZE 64
static unsigned int textureAtlas[TEX_SIZE * 4 * TEX_SIZE];
static unsigned int seed = 12345;
static unsigned int randInt() { seed = seed * 1103515245 + 12345; return (seed >> 16) & 0x7FFF; }
static void genAsphalt(int ox){for(int y=0;y<TEX_SIZE;y++)for(int x=0;x<TEX_SIZE;x++){int n=randInt()%40,b=70+n;if((x+y*3)%17==0||(x*2-y)%23==0)b-=30;if(b<0)b=0;if(b>255)b=255;textureAtlas[y*(TEX_SIZE*4)+ox+x]=0xFF000000|(b<<16)|(b<<8)|b;}}
static void genGrass(int ox){for(int y=0;y<TEX_SIZE;y++)for(int x=0;x<TEX_SIZE;x++){int n=randInt()%50;int r=30+n/3,g=90+n,b=30+n/2;if(r>255)r=255;if(g>255)g=255;if(b>255)b=255;textureAtlas[y*(TEX_SIZE*4)+ox+x]=0xFF000000|(r<<16)|(g<<8)|b;}}
static void genStone(int ox){for(int y=0;y<TEX_SIZE;y++)for(int x=0;x<TEX_SIZE;x++){int n=randInt()%60,b=100+n;if((x/8+y/8)%2==0)b-=15;textureAtlas[y*(TEX_SIZE*4)+ox+x]=0xFF000000|(b<<16)|((b-10)<<8)|(b-20);}}
static void genBark(int ox){for(int y=0;y<TEX_SIZE;y++)for(int x=0;x<TEX_SIZE;x++){int n=randInt()%30;int r=80+n,g=50+n/2,b=20+n/3;if(x%5==0){r-=20;g-=15;b-=10;}if(r<0)r=0;if(g<0)g=0;if(b<0)b=0;textureAtlas[y*(TEX_SIZE*4)+ox+x]=0xFF000000|(r<<16)|(g<<8)|b;}}
static void generateTextures(){seed=12345;genAsphalt(0);genGrass(TEX_SIZE);genStone(TEX_SIZE*2);genBark(TEX_SIZE*3);}

