typedef struct { float x,y,z; unsigned int color; } Vertex2D;
typedef struct { float s,t; unsigned int c; float x,y,z; } TextVertex;
void drawRect(float x,float y,float w,float h,unsigned int color){
    Vertex2D*v=(Vertex2D*)sceGuGetMemory(2*sizeof(Vertex2D));
    v[0].x=x;v[0].y=y;v[0].z=0;v[0].color=color;
    v[1].x=x+w;v[1].y=y+h;v[1].z=0;v[1].color=color;
    sceGuDrawArray(GU_SPRITES,GU_VERTEX_32BITF|GU_COLOR_8888|GU_TRANSFORM_2D,2,0,v);
}
void drawText(const char*text,float x,float y,unsigned int color){
    int len=strlen(text);if(len==0)return;
    sceGuTexMode(GU_PSM_8888,0,0,0);
    sceGuTexImage(0,FONT_W,FONT_H,FONT_W,font);
    sceGuTexFilter(GU_NEAREST,GU_NEAREST);
    sceGuTexFunc(GU_TFX_MODULATE,GU_TCC_RGBA);
    sceGuEnable(GU_TEXTURE_2D);
    TextVertex*v=(TextVertex*)sceGuGetMemory(sizeof(TextVertex)*2*len);
    for(int i=0;i<len;i++){
        unsigned char c=(unsigned char)text[i];
        if(c<32||c>=128)c='?';
        int tx=(c&0x0F)<<4,ty=(c&0xF0),w=fontwidthtab[c];
        TextVertex*v0=&v[i*2];TextVertex*v1=&v[i*2+1];
        v0->s=(float)tx;v0->t=(float)ty;v0->c=color;v0->x=x;v0->y=y;v0->z=0;
        v1->s=(float)(tx+w);v1->t=(float)(ty+16);v1->c=color;v1->x=x+w;v1->y=y+16;v1->z=0;
        x+=w;
    }
    sceGuDrawArray(GU_SPRITES,GU_TEXTURE_32BITF|GU_COLOR_8888|GU_VERTEX_32BITF|GU_TRANSFORM_2D,len*2,0,v);
    sceGuDisable(GU_TEXTURE_2D);
}

