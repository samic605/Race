#define PROFILE_COUNT (sizeof(carProfiles)/sizeof(CarProfile))

static int addVertex(float x,float y,float z,unsigned int c,float u,float v){
    if(carVertCount>=MAX_CAR_VERTS)return -1;
    carVertices[carVertCount].x=x; carVertices[carVertCount].y=y; carVertices[carVertCount].z=z;
    carVertices[carVertCount].color=c; carVertices[carVertCount].u=u; carVertices[carVertCount].v=v;
    return carVertCount++;
}
static void addTriangle(int a,int b,int c){
    if(carIdxCount+3>MAX_CAR_INDICES)return;
    carIndices[carIdxCount++]=(unsigned short)a; carIndices[carIdxCount++]=(unsigned short)b; carIndices[carIdxCount++]=(unsigned short)c;
}
static void addQuad(int a,int b,int c,int d){
    addTriangle(a,b,c); addTriangle(a,c,d);
}
static void connectProfiles(CarProfile *p1,CarProfile *p2){
    int base1=carVertCount;
    for(int i=0;i<p1->pointCount;i++) addVertex(p1->points[i][0],p1->points[i][1],p1->z,p1->color,0,0);
    int base2=carVertCount;
    for(int i=0;i<p2->pointCount;i++) addVertex(p2->points[i][0],p2->points[i][1],p2->z,p2->color,0,0);
    for(int i=0;i<p1->pointCount;i++){int next=(i+1)%p1->pointCount;addTriangle(base1+i,base1+next,base2+next);addTriangle(base1+i,base2+next,base2+i);}
}
static void closeProfile(CarProfile *p,int rev){
    int base=carVertCount;
    for(int i=0;i<p->pointCount;i++) addVertex(p->points[i][0],p->points[i][1],p->z,p->color,0,0);
    for(int i=1;i<p->pointCount-1;i++){if(rev)addTriangle(base,base+i+1,base+i);else addTriangle(base,base+i,base+i+1);}
}
static void addBox(float cx,float cy,float cz,float sx,float sy,float sz,unsigned int color){
    int b=carVertCount;
    addVertex(cx-sx,cy-sy,cz-sz,color,0,0); addVertex(cx+sx,cy-sy,cz-sz,color,0,0);
    addVertex(cx+sx,cy-sy,cz+sz,color,0,0); addVertex(cx-sx,cy-sy,cz+sz,color,0,0);
    addVertex(cx-sx,cy+sy,cz-sz,color,0,0); addVertex(cx+sx,cy+sy,cz-sz,color,0,0);
    addVertex(cx+sx,cy+sy,cz+sz,color,0,0); addVertex(cx-sx,cy+sy,cz+sz,color,0,0);
    addQuad(b+0,b+1,b+2,b+3); addQuad(b+4,b+7,b+6,b+5);
    addQuad(b+0,b+4,b+5,b+1); addQuad(b+2,b+6,b+7,b+3);
    addQuad(b+0,b+3,b+7,b+4); addQuad(b+1,b+5,b+6,b+2);
}
static void buildWheel(float cx,float cy,float cz,float r,float w,unsigned int tireColor){
    const int S=16; int base=carVertCount;
    for(int side=0;side<2;side++){
        float zo=(side==0)?-w/2:w/2;
        for(int i=0;i<S;i++){float a=(float)i/S*2.0f*3.14159f;addVertex(cx+cosf(a)*r,cy+sinf(a)*r,cz+zo,tireColor,0,0);}
    }
    for(int i=0;i<S;i++){int n=(i+1)%S;addQuad(base+i,base+n,base+S+n,base+S+i);}
    unsigned int diskColor = 0xFFCCCCCC;
    unsigned int spokeColor = 0xFFAAAAAA;
    for(int side=0;side<2;side++){
        float zo=(side==0)?-w/2-0.01f:w/2+0.01f;
        int diskBase=carVertCount;
        float diskR = r*0.6f;
        addVertex(cx,cy,cz+zo,diskColor,0,0);
        for(int i=0;i<S;i++){float a=(float)i/S*2.0f*3.14159f;addVertex(cx+cosf(a)*diskR,cy+sinf(a)*diskR,cz+zo,diskColor,0,0);}
        for(int i=0;i<S;i++){int n=(i+1)%S;if(side==0)addTriangle(diskBase,diskBase+1+n,diskBase+1+i);else addTriangle(diskBase,diskBase+1+i,diskBase+1+n);}
        for(int sp=0;sp<5;sp++){
            float a=(float)sp/5.0f*6.2831f;
            float wx=cx+cosf(a)*diskR*0.7f, wy=cy+sinf(a)*diskR*0.7f;
            addBox(wx,wy,cz+zo*1.02f,0.03f,0.03f,0.01f,spokeColor);
        }
    }
}

