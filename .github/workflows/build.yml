#define MAX_SPARKS 128
typedef struct { float x,y,z,vx,vy,vz,life,maxLife; unsigned int color; float size; } Spark;
static Spark sparks[MAX_SPARKS];
static int sparkCount = 0;
void spawnSparks(float x,float y,float z,float dirX,float dirZ,int count){
    for(int i=0;i<count;i++){if(sparkCount>=MAX_SPARKS)break;Spark*s=&sparks[sparkCount++];
        s->x=x;s->y=y;s->z=z;
        s->vx=dirX*(2.0f+randInt()%100/50.0f)+(randInt()%100-50)/100.0f;
        s->vy=1.0f+(randInt()%100)/50.0f;
        s->vz=dirZ*(2.0f+randInt()%100/50.0f)+(randInt()%100-50)/100.0f;
        s->life=0.3f+(randInt()%100)/300.0f;s->maxLife=s->life;
        s->color=0xFFFFDD00; s->size=4;}
}

#define MAX_SMOKE 128
typedef struct { float x,y,z,vx,vy,vz,life,maxLife; float size; unsigned int color; } Smoke;
static Smoke smokes[MAX_SMOKE];
static int smokeCount = 0;
void spawnSmoke(float x,float y,float z,int count){
    for(int i=0;i<count;i++){if(smokeCount>=MAX_SMOKE)break;Smoke*s=&smokes[smokeCount++];
        s->x=x+(randInt()%100-50)/100.0f;
        s->y=y+0.1f+(randInt()%100)/300.0f;
        s->z=z+(randInt()%100-50)/100.0f;
        s->vx=(randInt()%100-50)/200.0f;
        s->vy=0.6f+(randInt()%100)/150.0f;
        s->vz=(randInt()%100-50)/200.0f;
        s->life=0.8f+(randInt()%100)/200.0f;
        s->maxLife=s->life;
        s->size=3.0f;
        unsigned int gray = 120 + (randInt()%60);
        s->color=0xFF000000 | (gray<<16) | (gray<<8) | gray;
    }
}
void updateParticles(float dt){
    for(int i=0;i<sparkCount;i++){Spark*s=&sparks[i];
        s->x+=s->vx*dt;s->y+=s->vy*dt;s->z+=s->vz*dt;s->vy-=9.0f*dt;s->life-=dt;
        if(s->life<=0){sparks[i]=sparks[sparkCount-1];sparkCount--;i--;}}
    for(int i=0;i<smokeCount;i++){Smoke*s=&smokes[i];
        s->x+=s->vx*dt;s->y+=s->vy*dt;s->z+=s->vz*dt;
        s->vy-=0.5f*dt;
        s->size += dt * 6.0f;
        s->life-=dt;
        if(s->life<=0){smokes[i]=smokes[smokeCount-1];smokeCount--;i--;}}
}
void drawParticles(){
    for(int i=0;i<sparkCount;i++){Spark*s=&sparks[i];
        float relX=s->x-car.x,relZ=s->z-car.z;
        float cosA=cosf(-car.angle),sinA=sinf(-car.angle);
        float camX=relX*cosA-relZ*sinA,camZ=relX*sinA+relZ*cosA;
        if(camZ<0.5f)continue;
        float screenX=240+(camX/camZ)*200;
        float screenY=136-((s->y-car.y)/camZ)*200;
        float alphaF = s->life/s->maxLife;
        unsigned int alpha=(unsigned int)(255*alphaF);
        unsigned int r=(s->color>>16)&0xFF, g=(s->color>>8)&0xFF, b=s->color&0xFF;
        unsigned int color=(alpha<<24)|(r<<16)|(g<<8)|b;
        float sz = s->size * alphaF;
        drawRect(screenX-sz/2,screenY-sz/2,sz,sz,color);}
    for(int i=0;i<smokeCount;i++){Smoke*s=&smokes[i];
        float relX=s->x-car.x,relZ=s->z-car.z;
        float cosA=cosf(-car.angle),sinA=sinf(-car.angle);
        float camX=relX*cosA-relZ*sinA,camZ=relX*sinA+relZ*cosA;
        if(camZ<0.5f)continue;
        float screenX=240+(camX/camZ)*200;
        float screenY=136-((s->y-car.y)/camZ)*200;
        float alphaF = s->life/s->maxLife;
        unsigned int alpha=(unsigned int)(180*alphaF);
        unsigned int r=(s->color>>16)&0xFF, g=(s->color>>8)&0xFF, b=s->color&0xFF;
        unsigned int color=(alpha<<24)|(r<<16)|(g<<8)|b;
        float sz = s->size;
        drawRect(screenX-sz/2,screenY-sz/2,sz,sz,color);}
}

void drawMiniMap(){
    const float mapX=370,mapY=10,mapW=100,mapH=100;
    drawRect(mapX-4,mapY-4,mapW+8,mapH+8,0xCC000000);
    float minX=1e9f,maxX=-1e9f,minZ=1e9f,maxZ=-1e9f;
    for(int i=0;i<TRACK_SEGMENTS;i++){
        if(trackPoints[i].x<minX)minX=trackPoints[i].x;
        if(trackPoints[i].x>maxX)maxX=trackPoints[i].x;
        if(trackPoints[i].z<minZ)minZ=trackPoints[i].z;
        if(trackPoints[i].z>maxZ)maxZ=trackPoints[i].z;
    }
    float rangeX=maxX-minX,rangeZ=maxZ-minZ;
    if(rangeX<0.001f)rangeX=1;if(rangeZ<0.001f)rangeZ=1;
    float scale=(mapW<mapH?mapW:mapH)/(rangeX>rangeZ?rangeX:rangeZ)*0.9f;
    for(int i=0;i<TRACK_SEGMENTS;i+=2){
        float sx=mapX+(trackPoints[i].x-minX)*scale+(mapW-rangeX*scale)/2;
        float sy=mapY+(trackPoints[i].z-minZ)*scale+(mapH-rangeZ*scale)/2;
        drawRect(sx,sy,1.5f,1.5f,0xFFFFFFFF);
    }
    // Игрок
    float px=mapX+(car.x-minX)*scale+(mapW-rangeX*scale)/2;
    float py=mapY+(car.z-minZ)*scale+(mapH-rangeZ*scale)/2;
    drawRect(px-3,py-3,6,6,0xFFFF0000);
    // AI
    for(int i=0;i<MAX_AI;i++){
        float ax=mapX+(ais[i].x-minX)*scale+(mapW-rangeX*scale)/2;
        float ay=mapY+(ais[i].z-minZ)*scale+(mapH-rangeZ*scale)/2;
        unsigned int c = i==0 ? 0xFF00AAFF : (i==1 ? 0xFF00FF88 : 0xFFFFCC00);
        drawRect(ax-2,ay-2,4,4,c);
    }
    // Трафик
    for(int i=0;i<MAX_TRAFFIC;i++){
        if(!traffic[i].active)continue;
        float tx=mapX+(traffic[i].x-minX)*scale+(mapW-rangeX*scale)/2;
        float tz=mapY+(traffic[i].z-minZ)*scale+(mapH-rangeZ*scale)/2;
        drawRect(tx-1,tz-1,2,2,0xFF888888);
    }
    drawRect(mapX-4,mapY-4,mapW+8,2,0xFFAAAAAA);
    drawRect(mapX-4,mapY+mapH+2,mapW+8,2,0xFFAAAAAA);
    drawRect(mapX-4,mapY-4,2,mapH+8,0xFFAAAAAA);
    drawRect(mapX+mapW+2,mapY-4,2,mapH+8,0xFFAAAAAA);
}

