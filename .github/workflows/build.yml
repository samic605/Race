    tAddBox(t, 0, 0.4f, 2.02f, 0.4f, 0.15f, 0.02f, 0xFF222222);
    for(int i=-2;i<=2;i++) tAddBox(t, i*0.12f, 0.4f, 2.03f, 0.02f, 0.12f, 0.01f, 0xFF888888);
    tAddBox(t, -0.85f, 0.7f, 0.9f, 0.08f, 0.04f, 0.1f, yellow);
    tAddBox(t,  0.85f, 0.7f, 0.9f, 0.08f, 0.04f, 0.1f, yellow);
    tAddBox(t, -0.4f, 1.15f, 0.5f, 0.01f, 0.2f, 0.01f, 0xFF333333);
    tAddBox(t, 0.3f, 0.15f, -2.05f, 0.06f, 0.05f, 0.06f, 0xFF888888);
    tAddWheel(t, -0.85f, 0.2f, 1.3f, 0.25f, 0.2f, 0xFF111111);
    tAddWheel(t, 0.85f, 0.2f, 1.3f, 0.25f, 0.2f, 0xFF111111);
    tAddWheel(t, -0.85f, 0.2f, -1.3f, 0.25f, 0.2f, 0xFF111111);
